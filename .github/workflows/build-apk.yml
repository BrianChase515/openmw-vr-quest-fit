name: Build Quest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space (runner starts with ~14 GB free, build needs ~35 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build autoconf automake libtool \
            pkg-config patch bzip2 xz-utils gettext ccache unzip

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            android/buildscripts/downloads
            ~/.cache/ccache
          key: omw-${{ runner.os }}-${{ github.sha }}
          restore-keys: omw-${{ runner.os }}-

      - name: Build engine and libraries
        working-directory: android/buildscripts
        env:
          NCPU_OVERRIDE: 4
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache CCACHE_MAXSIZE=5G
          ./build.sh --ccache
          ccache -s || true

      - name: Package APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: openmw-vr-quest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/buildscripts/build/**/*.log
            android/buildscripts/build/**/CMakeError.log
          if-no-files-found: ignore
