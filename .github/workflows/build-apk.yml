name: Build Quest APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Newer CMake refuses the old minimum versions some bundled libraries declare.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space (runner starts with ~14 GB free, build needs ~35 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift /usr/local/share/chromium
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build autoconf automake libtool \
            pkg-config patch bzip2 xz-utils gettext ccache unzip

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            android/buildscripts/downloads
            ~/.cache/ccache
          key: omw-${{ runner.os }}-${{ github.sha }}
          restore-keys: omw-${{ runner.os }}-

      - name: Build engine and libraries
        working-directory: android/buildscripts
        shell: bash
        env:
          NCPU_OVERRIDE: 4
        run: |
          export CCACHE_DIR=$HOME/.cache/ccache CCACHE_MAXSIZE=5G
          cmake --version | head -1
          set -o pipefail
          ./build.sh --ccache 2>&1 | tee "$RUNNER_TEMP/build.log"
          ccache -s || true

      - name: Package APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - uses: actions/upload-artifact@v4
        with:
          name: openmw-vr-quest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to the 'apk' branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/apk" && cd "$RUNNER_TEMP/apk"
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" openmw-vr-quest.apk
          echo "Built from ${GITHUB_SHA} on $(date -u)" > BUILD.txt
          git init -q -b apk && git add . 
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Publish logs to the 'ci-logs' branch on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          for f in build.log gradle.log; do
            [ -f "$RUNNER_TEMP/$f" ] && tail -n 600 "$RUNNER_TEMP/$f" > "tail-$f"
          done
          cd "$GITHUB_WORKSPACE/android/buildscripts/build" 2>/dev/null && \
            find . -name '*.log' -size -2M -newer "$GITHUB_WORKSPACE/README.md" \
              -exec cp --parents {} "$RUNNER_TEMP/logs/" \; || true
          cd "$RUNNER_TEMP/logs"
          echo "Failed run ${GITHUB_RUN_ID} at ${GITHUB_SHA}" > RUN.txt
          git init -q -b ci-logs && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Logs from run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
