name: Publish fitness scripts

# Script-only changes don't need a 20-minute engine build: this swaps the new fitness-mod.zip,
# installer and guide into the 'apk' download branch next to the existing APK.
on:
  push:
    branches: [main]
    paths:
      - 'fitness-mod/**'
      - 'tools/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quest-apk-scripts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update the download branch
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch apk "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/apk"
          cd "$RUNNER_TEMP/apk"
          rm -f fitness-mod.zip QUEST-FITNESS.md
          (cd "$GITHUB_WORKSPACE/fitness-mod" && zip -qr "$RUNNER_TEMP/apk/fitness-mod.zip" .)
          cp "$GITHUB_WORKSPACE/tools/install-to-quest.bat" "$GITHUB_WORKSPACE/README.md" .
          echo "Scripts from ${GITHUB_SHA} on $(date -u)" > SCRIPTS.txt
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Scripts from ${GITHUB_SHA}" || exit 0
          git push -q origin apk
